version = 1

# Which licence covers what is in LICENSE.md. Files that can't carry a header are listed here;
# the last matching annotation wins. Tooling, configuration and root documents are MIT.
[[annotations]]
path = [
  "**/*.md",
  "**/*.json",
  "**/*.jsonc",
  "**/*.yml",
  "**/*.yaml",
  "**/*.toml",
  ".github/CODEOWNERS",
  ".gitignore",
  ".editorconfig",
  "bun.lock",
  "tooling/oxlint-rules/fixtures/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Snowy Authors"
SPDX-License-Identifier = "MIT"

# Every package is under the Snowy License, new ones included; ffmpeg's annotation below
# overrides this for packages/ffmpeg.
[[annotations]]
path = [
  "packages/**/*.md",
  "packages/**/*.json",
  "packages/**/*.jsonc",
  "packages/**/*.yml",
  "packages/**/*.yaml",
  "packages/**/*.toml",
  "packages/**/.gitignore",
  "packages/*/test/fixtures/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Snowy Authors"
SPDX-License-Identifier = "LicenseRef-Snowy-License-1.0"

# The name and logos are trademarks, not licensed (TRADEMARKS.md).
[[annotations]]
path = "brand/*.png"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Pratik Kumar Singh"
SPDX-License-Identifier = "LicenseRef-Snowy-Brand"

# @snowy-media/ffmpeg is LGPL, like FFmpeg.
[[annotations]]
path = [
  "packages/ffmpeg/**/*.md",
  "packages/ffmpeg/**/*.json",
  "packages/ffmpeg/NOTICE",
  "packages/ffmpeg/.dockerignore",
  "packages/ffmpeg/.clang-format",
  "packages/ffmpeg/.hadolint.yaml",
  "packages/ffmpeg/dist.sha256",
  "packages/ffmpeg/bench/results/**",
  "packages/ffmpeg/test/fixtures/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Snowy Authors"
SPDX-License-Identifier = "LGPL-2.1-or-later"

[[annotations]]
path = "packages/ffmpeg/keys/ffmpeg-devel.asc"
precedence = "aggregate"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "LicenseRef-not-copyrightable"
