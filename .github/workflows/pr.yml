#
# Pull requests are squash-merged, so the title becomes the commit message on main and
# must follow Conventional Commits (CONTRIBUTING.md#commits-and-pull-requests).
name: pr

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions: {}

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|test|docs|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [a-z].{1,70}[^.]$'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::'$TITLE' is not a Conventional Commit title, e.g. 'fix(core): keep pts when seeking raw H.264'"
            exit 1
          fi

  # feat, fix and perf change what users get, so they need an entry in the changed package's
  # CHANGELOG.md. The no-changelog label skips the check for changes nobody outside the
  # repository notices.
  changelog:
    if: >-
      !contains(github.event.pull_request.labels.*.name, 'no-changelog')
      && (startsWith(github.event.pull_request.title, 'feat')
      || startsWith(github.event.pull_request.title, 'fix')
      || startsWith(github.event.pull_request.title, 'perf'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check a CHANGELOG.md is updated
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! gh pr diff "$PR" -R "$REPO" --name-only | grep -Eq '^packages/[^/]+/CHANGELOG\.md$'; then
            echo "::error::Add a line under Unreleased in the changed package's CHANGELOG.md, or label the pull request no-changelog."
            exit 1
          fi

  # A coverage floor goes down only when the pull request says why, with the lowers-coverage
  # label (AGENTS.md rule 11).
  floors:
    if: "!contains(github.event.pull_request.labels.*.name, 'lowers-coverage')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - name: Fetch the base
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git fetch --depth=1 origin "$BASE"
      - name: Check no floor is lowered
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bun tooling/check-floors.ts "$BASE"
