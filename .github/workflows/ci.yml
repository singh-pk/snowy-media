name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces its run. Each commit on main has a group of its own,
  # so no run there is cancelled, or replaced while it waits.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # The type declarations, without the Docker build, so typecheck covers them.
      - run: bun packages/ffmpeg/scripts/gen-dts.ts
      - run: bun run check

  repo:
    name: workflows, shell, Dockerfile, spelling, licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: shellcheck@0.11.0,shfmt@3.14.1,typos@1.51.1,zizmor@1.31.1
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: hadolint
        run: docker run --rm -v "$PWD:/repo" -w /repo hadolint/hadolint:v2.15.1 hadolint --config packages/ffmpeg/.hadolint.yaml packages/ffmpeg/Dockerfile
      - run: shellcheck packages/ffmpeg/build/*.sh .githooks/*
      - run: shfmt --diff packages/ffmpeg/build .githooks
      - run: typos
      - run: zizmor --offline --min-severity=low .github
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  # Pull requests skip the jobs of packages they leave alone (the ffmpeg build takes minutes);
  # pushes to main always run every job, which also keeps the build cache warm.
  changes:
    name: changed packages
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
      ffmpeg: ${{ steps.diff.outputs.ffmpeg }}
      sync: ${{ steps.diff.outputs.sync }}
      timeline: ${{ steps.diff.outputs.timeline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # A file counts for a package if it is in the package or outside packages/ (lockfile,
      # shared configuration, workflows). Markdown never changes a build. On a pull request
      # HEAD is the merge commit, so HEAD^1 is the base it merges into; --no-renames also
      # lists the old path of a file moved out of a package. The engine runs on ffmpeg, so it
      # is tested when either changes.
      - id: diff
        run: |
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          changed() {
            [ "$GITHUB_EVENT_NAME" = push ] || printf '%s\n' "$files" \
              | awk -v dir="packages/$1/" '!/\.md$/ && (!/^packages\// || index($0, dir) == 1) { found = 1 } END { exit !found }'
          }
          ffmpeg=false
          engine=false
          if changed ffmpeg; then ffmpeg=true; engine=true; fi
          if changed engine; then engine=true; fi
          sync=false
          if changed sync; then sync=true; fi
          timeline=false
          if changed timeline; then timeline=true; fi
          {
            echo "ffmpeg=$ffmpeg"
            echo "engine=$engine"
            echo "sync=$sync"
            echo "timeline=$timeline"
          } >> "$GITHUB_OUTPUT"

  # Also builds the modules the engine job tests against; ffmpeg's own tests run only when
  # it changed.
  build:
    name: ffmpeg build and test
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ffmpeg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: packages/ffmpeg
          target: dist
          outputs: type=local,dest=packages/ffmpeg/dist
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Reproducible build
        run: sha256sum -c dist.sha256
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      # The modules run no code built from a string (AGENTS.md rule 7); the Dockerfile builds
      # them with -sDYNAMIC_EXECUTION=0, and this holds the output to it.
      - name: No code from strings
        run: bunx oxlint -c ../../tooling/oxlint-dist.json --no-ignore dist/*/*.js
      - run: bun scripts/gen-dts.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-dist
          path: packages/ffmpeg/dist
          if-no-files-found: error
          retention-days: 1
      - if: needs.changes.outputs.ffmpeg == 'true'
        run: bunx playwright install --with-deps chromium
      - if: needs.changes.outputs.ffmpeg == 'true'
        run: bun test

  engine:
    name: engine test (${{ matrix.os }})
    needs: [changes, build]
    if: needs.changes.outputs.engine == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Only macOS runners have WebGPU with a GPU in Chromium; Windows and Linux render in
        # software (packages/engine/docs/architecture.md#testing).
        include:
          - os: macos-26
          - os: windows-latest
            gpu: warp
          - os: ubuntu-latest
            gpu: swiftshader
    runs-on: ${{ matrix.os }}
    env:
      SNOWY_GPU: ${{ matrix.gpu }}
    # It takes about 5 minutes; a browser that hangs would otherwise hold the runner for 6 hours.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/engine
        # Not Windows' PowerShell, so the steps run the same on every runner.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      # macOS runners have no Docker, so the modules come from the build job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ffmpeg-dist
          path: packages/ffmpeg/dist
      # The published bundle; the tests build their own (test/support/serve.ts).
      - run: bun run build
      # --with-deps installs the libraries Chromium needs on Linux, and nothing elsewhere.
      - run: bunx playwright install --with-deps chromium
      # Line coverage of every test, held to coverage-floor.json (tooling/coverage.ts), on the
      # macOS runner, whose GPU decodes and imports what the software ones cannot; not the
      # benchmarks', which it would slow. The other runners test the code as it ships, without
      # the coverage hooks in every thread.
      - run: bun run test
        env:
          SNOWY_COVERAGE: ${{ runner.os == 'macOS' && '1' || '' }}
      - if: runner.os == 'macOS'
        run: bun ../../tooling/check-coverage.ts engine
      # For reading only: shared runners are too noisy to fail on (packages/engine/bench).
      - run: bun run bench --runs 5 >> "$GITHUB_STEP_SUMMARY"

  # Unit tests in Chromium (packages/sync/docs/architecture.md#testing).
  sync:
    name: sync test
    needs: changes
    if: needs.changes.outputs.sync == 'true'
    runs-on: ubuntu-latest
    env:
      SNOWY_COVERAGE: "1"
    defaults:
      run:
        working-directory: packages/sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
      - run: bun ../../tooling/check-coverage.ts sync

  # Unit tests in Chromium (packages/timeline/AGENTS.md).
  timeline:
    name: timeline test
    needs: changes
    if: needs.changes.outputs.timeline == 'true'
    runs-on: ubuntu-latest
    env:
      SNOWY_COVERAGE: "1"
    defaults:
      run:
        working-directory: packages/timeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test
      - run: bun ../../tooling/check-coverage.ts timeline

  # The one check the main ruleset requires, so adding, renaming or skipping a job never
  # needs a ruleset change; a new job must be added to needs below. Skipped jobs pass;
  # failed or cancelled ones do not.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [check, repo, changes, build, engine, sync, timeline]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case $result in
              success | skipped) ;;
              *) echo "::error::a required job ended with $result" && exit 1 ;;
            esac
          done
